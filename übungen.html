<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Übungen</title>
</head>
<body>
    <h1>Übungen</h1>
    <div id="ausgabe"> </div>
    <p>Hallo</p>
    <p>Hallo</p>
    <p>Hallo</p>
    <script>
        let ausgabe = document.getElementById("ausgabe");

        let mstr = "Hallo World";
        ausgabe.innerHTML += " Länge <br>" + mstr + "=" + mstr.length;
        ausgabe.innerHTML += "<br>" + mstr + "=" + mstr.charAt(0);
        let suche = "1";
        let zaehler =0;
        for (let i = 0; i < mstr.length; i++) {
            if (mstr.charAt(i) == suche) {
                zaehler++;
            }
        }
        ausgabe.innerHTML += "<br> Anzahl von " + suche + " in " + mstr + "=" + zaehler;
        // suche nach dem text im string 
        ausgabe.innerHTML += "<br>suche world im str " +  mstr .indexOf("l");
        // Concat 
        mstr = mstr.concat(" gschisti gschasti!!");
        mstr = mstr + " gschisti";
        ausgabe.innerHTML += "<br>" + mstr;
        // ersetzen                                 Suche,,, Ersetzen
        ausgabe.innerHTML += "<br>" + mstr.replace("Hallo","HELLO KITTY");
        // Split
        let woerter = mstr.split(" ");
        ausgabe.innerHTML += "<br>Woerteranzahl" + woerter.length;

        for (let i = 0; i < woerter.length; i++) {
            ausgabe.innerHTML += "<br>" + woerter[i] + "lwort:" + woerter[i].length;
        }
        // Ausschneiden
        ausgabe.innerHTML += "<br>Ausschneiden 1-3 von Hallo..." + mstr.slice(1, 4);
        let pes = document.getElementsByTagName("p");
        ausgabe.innerHTML += "<br>? Anzahl p" + pes.length;
        for (let i = 0; i < pes.length; i++) {
            pes[i].innerHTML += i + 1;
        }

    </script>
    
</body>
</html>
