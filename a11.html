<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="output"></div>
    
    <div id="output2"></div>
    <script>
        

        function add(a, b) {
            return a + b;
        }

        function sub(a, b) {
            return a - b;
        }

        function mul(a, b) {
            return a * b;
        }

        function div(a, b) {
            return a / b;
        }
        function output(wert, name) {
            let output = document.getElementById(name);
            output.innerHTML += wert + '<br>';
         
        }
      
    function ausgabe(wert,outputId) {
       
        switch (outputId) {
            case 1:
                output(wert, "output");
                break;
            case 2:
                output(wert, "output2");
                break;
            case 3:
                console.log(wert);
                break;
                default:
                    break;
        }

    }

    ausgabe(add(5, 10), 1);
    ausgabe(sub(5, 10), 2);
    ausgabe(mul(5, 10), 3);
    ausgabe(div(5, 10), 1);





    
    </script>
</body>
</html>
