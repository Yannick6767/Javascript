<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einkaufsliste</title>
</head>

<body>
    <h1>Einkaufsliste</h1>

    <input id="itemInput" type="text" placeholder="Essen eingeben">
<button onclick="addItem()">Hinzufügen</button> 

<ul id="list"></ul>

<script >

let einkaufsliste = []; // Speichert alle einträge

function addItem() { // tut eingabe hinzufügen (in Array)
  let input = document.getElementById("itemInput"); 
  let text = input.value.trim(); //holt den Text aus dem Eingabefeld.

  if (text === "") return; //Wenn das Eingabefeld leer ist, dann brich die Funktion sofort ab.

  // In Array hinten anfügen
  einkaufsliste.push(text); 

  // Liste neu anzeigen 
  renderList();

  input.value = ""; //Eingabefeld wird geleert.
}

function renderList() { //Diese Funktion zeigt die Liste im Browser an.
  let ul = document.getElementById("list"); 
  ul.innerHTML = ""; // Liste leeren

  // Jeden Eintrag aus dem Array durchgehen
  einkaufsliste.forEach((item, index) => {
    let li = document.createElement("li");
    li.textContent = item;

    // Löschen-Button
    let deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Löschen";
    deleteBtn.onclick = () => {
      einkaufsliste.splice(index, 1); // Aus Array löschen
      renderList(); // Liste neu anzeigen
    };
    // Die Buttons werden unter das jeweilige Listenelement gehängt.
    li.appendChild(deleteBtn);
    ul.appendChild(li);
  });
}










    
</script>

    
</body>
</html>
